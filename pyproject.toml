[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-kit"
dynamic = ["version"]
description = "Portable workflow pack and installer for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Pipeline Kit maintainers" }]
dependencies = []

[project.optional-dependencies]
orchestrator = ["cursor-sdk", "typesafe-sdk"]
assess = ["pipeline-kit-assess"]
memory = ["pipeline-kit-memory"]
# Enterprise license engine is a private package (not on public PyPI).
# Install separately: pip install -e ../pipeline-kit-license

[tool.uv.workspace]
members = ["packages/pipeline-kit-assess", "packages/pipeline-kit-memory"]

[tool.uv.sources]
pipeline-kit-assess = { workspace = true }
pipeline-kit-memory = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pipeline-kit = "pipeline_kit.install:cli_main"

[tool.setuptools]
packages = ["pipeline_kit", "knowledge", "pipeline_plugins", "pipeline_features", "pipeline_observability", "pipeline_observability.adapters", "pipeline_eval", "pipeline_orchestrator", "pipeline_orchestrator.deciders", "pipeline_orchestrator.runners"]
package-dir = { pipeline_kit = ".", knowledge = "capabilities/knowledge", pipeline_plugins = "capabilities/plugins", pipeline_features = "capabilities/feature_flags", pipeline_observability = "capabilities/observability", pipeline_eval = "capabilities/eval", pipeline_orchestrator = "orchestrator" }
include-package-data = true

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.package-data]
pipeline_kit = [
  "VERSION",
  "CUSTOMER-GUIDE.md",
  "LICENSE",
  "kit/pipeline/**/*",
]
pipeline_orchestrator = [
  "prompts/*",
]


