name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Public CI: no private pipeline-kit-license. Fail-closed and crypto
          # tests skip or use license_absent; other tests open gates in conftest.
          python -m pip install -e ".[dev,orchestrator,assess,memory]"

      - name: Tests
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          from pathlib import Path
          arts = list(Path("dist").glob("*"))
          assert arts, "no build artifacts"
          names = " ".join(p.name for p in arts)
          assert "pipeline_kit" in names or "pipeline-kit" in names
          print("built:", names)
          PY

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build documentation site
        working-directory: website
        run: |
          npm ci
          npm run build
