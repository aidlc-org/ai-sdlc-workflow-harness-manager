name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          # Public CI: no private pipeline-kit-license. Fail-closed and crypto
          # tests skip or use license_absent; other tests open gates in conftest.
          # assess/memory live under packages/ and are not on public PyPI yet.
          # uv workspace sources do not apply to plain pip — install by path.
          python -m pip install \
            -e "./packages/pipeline-kit-assess" \
            -e "./packages/pipeline-kit-memory" \
            -e ".[dev,orchestrator]"
