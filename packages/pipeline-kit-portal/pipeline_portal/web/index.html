<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Local admin dashboard for pipeline-kit: fleet health, feature/plugin toggles." />
  <title>pipeline-kit portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b66e0'/%3E%3Cpath d='M9 22V10l7 4 7-4v12' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18V8l8 4 8-4v10" /></svg>
      </span>
      pipeline-kit<span class="badge-portal">portal</span>
    </div>
    <nav class="crumbs" id="crumbs">Fleet</nav>
    <div class="status-pill" id="connStatus"><span class="status-dot"></span><span class="status-text">connecting&hellip;</span></div>
  </header>

  <main id="app">
    <section id="fleetView" class="view">
      <div class="page-heading">
        <div>
          <h1>Fleet</h1>
          <span class="subtitle" id="fleetSubtitle">Loading registered projects&hellip;</span>
        </div>
        <div class="heading-actions">
          <div class="search-wrap">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></svg>
            <input id="fleetSearch" class="input" type="search" placeholder="Filter by name, path, or team&hellip;" autocomplete="off" />
          </div>
          <button id="openAddDrawer" class="btn btn-primary" type="button">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
            Add project
          </button>
        </div>
      </div>
      <div id="fleetGroups"></div>
    </section>

    <section id="projectView" class="view" hidden>
      <div class="project-header">
        <div class="project-header-top">
          <button id="backToFleet" class="btn-icon" type="button" title="Back to fleet">
            <svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <div style="min-width:0;flex:1">
            <h1 id="projectTitle">&nbsp;</h1>
            <span class="subtitle" id="projectPath"></span>
          </div>
        </div>
        <div class="tabs" id="projectTabs">
          <button data-tab="setup" class="tab active">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
            Setup
          </button>
          <button data-tab="health" class="tab">
            <svg class="icon" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2" /></svg>
            Health
          </button>
          <button data-tab="config" class="tab">
            <svg class="icon" viewBox="0 0 24 24"><path d="m18 16 4-4-4-4M6 8l-4 4 4 4M14.5 4l-5 16" /></svg>
            Config
          </button>
        </div>
      </div>
      <div id="tabSetup" class="tab-pane"></div>
      <div id="tabHealth" class="tab-pane" hidden></div>
      <div id="tabConfig" class="tab-pane" hidden></div>
    </section>
  </main>

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="addDrawer" aria-label="Add project">
    <div class="drawer-head">
      <h2>Add project</h2>
      <button id="closeAddDrawer" class="btn-icon" type="button" title="Close">
        <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" /></svg>
      </button>
    </div>
    <form id="addForm" class="drawer-body">
      <div class="field">
        <label for="addPath">Project path</label>
        <input id="addPath" name="path" class="input" placeholder="D:\repos\checkout-api" required />
      </div>
      <div class="field">
        <label for="addTeam">Team</label>
        <input id="addTeam" name="team" class="input" placeholder="payments (optional)" />
      </div>
      <div class="field">
        <label for="addLabel">Display label</label>
        <input id="addLabel" name="label" class="input" placeholder="Checkout API (optional)" />
      </div>
    </form>
    <div class="drawer-footer">
      <button id="cancelAdd" class="btn btn-secondary" type="button">Cancel</button>
      <button id="submitAdd" class="btn btn-primary" type="submit" form="addForm">Add project</button>
    </div>
  </aside>

  <div class="toast-stack" id="toastStack"></div>

  <script src="/assets/app.js"></script>
</body>
</html>
